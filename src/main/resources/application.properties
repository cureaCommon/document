spring.application.name=document
server.port=8086

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=document
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

document.storage=database
document.max-file-bytes=20971520
document.orphan-retention-hours=24
gateway.trust-secret=${GATEWAY_TRUST_SECRET:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
